<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KM 营销创意看板</title>
<style>
  :root {
    --blue-1: #0C82FF;
    --blue-2: #3B9AFF;
    --blue-3: #6CB4FF;
    --blue-4: #E8F2FF;
    --blue-5: #F4F9FF;
    --dark: #1A1A1A;
    --gray-1: #333;
    --gray-2: #666;
    --gray-3: #999;
    --gray-4: #CCC;
    --gray-5: #F5F5F5;
    --white: #FFF;
    --red: #E8473F;
    --green: #2BA471;
    --orange: #FF8800;
    --purple: #7B61FF;
    --radius: 8px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Helvetica Neue', sans-serif;
    background: var(--gray-5);
    color: var(--gray-1);
    min-height: 100vh;
  }
  /* Header */
  .header {
    background: linear-gradient(135deg, var(--blue-1), var(--blue-2));
    color: white;
    padding: 32px 0 28px;
    position: sticky; top: 0; z-index: 100;
    box-shadow: 0 4px 20px rgba(12,130,255,0.2);
  }
  .header-inner {
    max-width: 1200px; margin: 0 auto; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .header h1 { font-size: 24px; font-weight: 700; letter-spacing: 1px; }
  .header .subtitle { font-size: 13px; opacity: 0.8; margin-top: 4px; }
  .header .stats { display: flex; gap: 20px; }
  .header .stat-item { text-align: center; }
  .header .stat-num { font-size: 28px; font-weight: 700; }
  .header .stat-label { font-size: 11px; opacity: 0.7; }

  /* Controls */
  .controls {
    max-width: 1200px; margin: 0 auto; padding: 20px 24px 0;
    display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  }
  .search-box {
    flex: 1; min-width: 200px; max-width: 400px;
    padding: 10px 16px; border-radius: var(--radius);
    border: 1px solid var(--gray-4); font-size: 14px;
    outline: none; transition: border-color 0.2s;
  }
  .search-box:focus { border-color: var(--blue-1); }
  .filter-tabs { display: flex; gap: 6px; }
  .filter-tab {
    padding: 8px 16px; border-radius: 20px; border: none;
    font-size: 13px; cursor: pointer; transition: all 0.2s;
    background: var(--white); color: var(--gray-2);
    border: 1px solid var(--gray-4);
  }
  .filter-tab:hover { border-color: var(--blue-2); color: var(--blue-1); }
  .filter-tab.active {
    background: var(--blue-1); color: white; border-color: var(--blue-1);
  }

  /* Main */
  .main { max-width: 1200px; margin: 0 auto; padding: 20px 24px 60px; }

  /* Direction sections */
  .section { margin-bottom: 32px; }
  .section-header {
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 16px; padding-bottom: 12px;
    border-bottom: 2px solid var(--gray-5);
  }
  .section-icon {
    width: 36px; height: 36px; border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .section-title { font-size: 18px; font-weight: 600; }
  .section-count {
    font-size: 12px; color: var(--gray-3);
    background: var(--gray-5); padding: 2px 10px; border-radius: 12px;
  }

  /* Cards */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
  .card {
    background: var(--white); border-radius: var(--radius);
    padding: 20px; box-shadow: var(--shadow);
    transition: all 0.2s; cursor: pointer; position: relative;
    border: 1px solid transparent;
  }
  .card:hover {
    border-color: var(--blue-2); transform: translateY(-2px);
    box-shadow: 0 6px 24px rgba(12,130,255,0.1);
  }
  .card-title {
    font-size: 15px; font-weight: 600; line-height: 1.5;
    margin-bottom: 8px; color: var(--dark);
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-summary {
    font-size: 13px; line-height: 1.6; color: var(--gray-2);
    margin-bottom: 12px;
    display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  .card-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: var(--gray-3); }
  .card-meta .author { color: var(--gray-2); font-weight: 500; }
  .card-meta .dot { color: var(--gray-4); }
  .card-tags { display: flex; gap: 6px; margin-top: 12px; }
  .card-tag {
    font-size: 11px; padding: 2px 8px; border-radius: 4px;
    background: var(--blue-4); color: var(--blue-1);
  }
  .card-hot {
    position: absolute; top: 12px; right: 16px;
    font-size: 11px; color: var(--orange); font-weight: 600;
  }

  /* Timeline */
  .timeline-section { margin-top: 40px; }
  .timeline {
    position: relative; padding-left: 28px;
  }
  .timeline::before {
    content: ''; position: absolute; left: 8px; top: 0; bottom: 0;
    width: 2px; background: var(--gray-4);
  }
  .timeline-item {
    position: relative; margin-bottom: 24px;
    padding: 16px 20px; background: var(--white);
    border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .timeline-item::before {
    content: ''; position: absolute; left: -24px; top: 20px;
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--blue-1); border: 2px solid var(--blue-4);
  }
  .timeline-date {
    font-size: 12px; color: var(--gray-3); margin-bottom: 4px;
  }
  .timeline-title {
    font-size: 14px; font-weight: 600;
  }
  .timeline-title a { color: var(--dark); text-decoration: none; }
  .timeline-title a:hover { color: var(--blue-1); }
  .timeline-meta { font-size: 12px; color: var(--gray-3); margin-top: 4px; }

  /* Empty */
  .empty { text-align: center; padding: 60px 20px; color: var(--gray-3); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }

  /* Footer */
  .footer {
    text-align: center; padding: 24px; color: var(--gray-3); font-size: 12px;
  }
  .footer a { color: var(--blue-1); text-decoration: none; }

  /* View toggle */
  .view-toggle { display: flex; gap: 4px; margin-left: auto; }
  .view-btn {
    width: 32px; height: 32px; border: 1px solid var(--gray-4);
    border-radius: 6px; background: var(--white); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; transition: all 0.2s;
  }
  .view-btn.active { background: var(--blue-1); color: white; border-color: var(--blue-1); }

  /* Direction colors */
  .dir-素材生成 .section-icon { background: #FFF3E0; }
  .dir-创意生成 .section-icon { background: #F3E5F5; }
  .dir-广告投放 .section-icon { background: #E3F2FD; }
  .dir-营销活动 .section-icon { background: #E8F5E9; }
  .dir-素材生成 .card-tag { background: #FFF3E0; color: #E65100; }
  .dir-创意生成 .card-tag { background: #F3E5F5; color: #7B1FA2; }
  .dir-广告投放 .card-tag { background: #E3F2FD; color: #1565C0; }
  .dir-营销活动 .card-tag { background: #E8F5E9; color: #2E7D32; }

  @media (max-width: 768px) {
    .cards { grid-template-columns: 1fr; }
    .header-inner { flex-direction: column; gap: 12px; text-align: center; }
    .controls { flex-direction: column; }
    .search-box { max-width: 100%; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div>
      <h1>📰 KM 营销创意看板</h1>
      <div class="subtitle">素材 · 创意 · 投放 · 营销 — 每日自动追踪</div>
    </div>
    <div class="stats" id="stats"></div>
  </div>
</div>

<div class="controls">
  <input class="search-box" id="search" placeholder="搜索标题、作者..." />
  <div class="filter-tabs" id="filters"></div>
  <div class="view-toggle">
    <button class="view-btn active" data-view="card" title="卡片视图">▦</button>
    <button class="view-btn" data-view="timeline" title="时间线">☷</button>
  </div>
</div>

<div class="main" id="main"></div>

<div class="footer">
  数据来源：KM (km.woa.com) · 自动抓取 · <a href="https://git.woa.com/formhuang/km-marketing-daily" target="_blank">项目仓库</a>
</div>

<script>
const DIRECTIONS = [
  { name: '素材生成', emoji: '🎨', color: '#E65100' },
  { name: '创意生成', emoji: '💡', color: '#7B1FA2' },
  { name: '广告投放', emoji: '📣', color: '#1565C0' },
  { name: '营销活动', emoji: '🎯', color: '#2E7D32' },
];

let articles = [];
let currentFilter = '全部';
let currentView = 'card';
let searchQuery = '';

async function loadData() {
  try {
    const resp = await fetch('data/articles.json?t=' + Date.now());
    articles = await resp.json();
  } catch(e) {
    console.error('加载数据失败', e);
    articles = [];
  }
  render();
}

function getFiltered() {
  let list = articles;
  if (currentFilter !== '全部') {
    list = list.filter(a => a.direction === currentFilter);
  }
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter(a =>
      (a.title || '').toLowerCase().includes(q) ||
      (a.author || '').toLowerCase().includes(q)
    );
  }
  return list;
}

function renderStats() {
  const el = document.getElementById('stats');
  const total = articles.length;
  const directions = new Set(articles.map(a => a.direction)).size;
  const latest = articles.length ? articles.sort((a,b) => b.date.localeCompare(a.date))[0].date : '-';
  el.innerHTML = `
    <div class="stat-item"><div class="stat-num">${total}</div><div class="stat-label">文章总数</div></div>
    <div class="stat-item"><div class="stat-num">${directions}</div><div class="stat-label">覆盖方向</div></div>
    <div class="stat-item"><div class="stat-num">${latest.slice(5)}</div><div class="stat-label">最近更新</div></div>
  `;
}

function renderFilters() {
  const el = document.getElementById('filters');
  const all = ['全部', ...DIRECTIONS.map(d => d.name)];
  el.innerHTML = all.map(name => {
    const active = name === currentFilter ? 'active' : '';
    const emoji = name === '全部' ? '📋' : DIRECTIONS.find(d => d.name === name)?.emoji || '';
    return `<button class="filter-tab ${active}" data-filter="${name}">${emoji} ${name}</button>`;
  }).join('');
}

function renderCardView(filtered) {
  const main = document.getElementById('main');
  if (!filtered.length) {
    main.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div>暂无文章</div></div>';
    return;
  }

  // Group by direction
  const groups = {};
  DIRECTIONS.forEach(d => { groups[d.name] = []; });
  filtered.forEach(a => {
    if (groups[a.direction]) groups[a.direction].push(a);
  });

  let html = '';
  DIRECTIONS.forEach(dir => {
    const items = groups[dir.name];
    if (currentFilter !== '全部' && currentFilter !== dir.name) return;
    if (currentFilter === '全部' && !items.length) return;

    html += `<div class="section dir-${dir.name}">
      <div class="section-header">
        <div class="section-icon">${dir.emoji}</div>
        <div class="section-title">${dir.name}</div>
        <div class="section-count">${items.length}篇</div>
      </div>
      <div class="cards">`;

    items.sort((a,b) => b.date.localeCompare(a.date));
    items.forEach(a => {
      const hot = (parseInt(a.reads) > 1000) ? `<div class="card-hot">🔥 ${a.reads}阅</div>` : '';
      const summaryHtml = a.summary ? `<div class="card-summary">${a.summary}</div>` : '';
      html += `
        <a class="card" href="${a.link}" target="_blank" style="text-decoration:none">
          ${hot}
          <div class="card-title">${a.title}</div>
          ${summaryHtml}
          <div class="card-meta">
            <span class="author">${a.author}</span>
            <span class="dot">·</span>
            <span>${a.date.slice(5)}</span>
            ${a.reads ? `<span class="dot">·</span><span>${a.reads}阅</span>` : ''}
          </div>
          <div class="card-tags">
            <span class="card-tag">${a.direction}</span>
          </div>
        </a>`;
    });

    html += '</div></div>';
  });

  main.innerHTML = html;
}

function renderTimelineView(filtered) {
  const main = document.getElementById('main');
  if (!filtered.length) {
    main.innerHTML = '<div class="empty"><div class="empty-icon">📭</div><div>暂无文章</div></div>';
    return;
  }

  const sorted = [...filtered].sort((a,b) => b.date.localeCompare(a.date));
  let html = '<div class="timeline-section"><div class="timeline">';
  sorted.forEach(a => {
    const dir = DIRECTIONS.find(d => d.name === a.direction);
    const summaryLine = a.summary ? `<div style="font-size:12px;color:var(--gray-2);margin-top:4px">${a.summary}</div>` : '';
    html += `
      <div class="timeline-item">
        <div class="timeline-date">${a.date} ${dir?.emoji || ''} ${a.direction}</div>
        <div class="timeline-title"><a href="${a.link}" target="_blank">${a.title}</a></div>
        ${summaryLine}
        <div class="timeline-meta">${a.author}${a.reads ? ` · ${a.reads}阅` : ''}${a.likes ? ` · ${a.likes}赞` : ''}</div>
      </div>`;
  });
  html += '</div></div>';
  main.innerHTML = html;
}

function render() {
  renderStats();
  renderFilters();
  const filtered = getFiltered();
  if (currentView === 'card') renderCardView(filtered);
  else renderTimelineView(filtered);
}

// Events
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

document.getElementById('filters').addEventListener('click', e => {
  const tab = e.target.closest('.filter-tab');
  if (!tab) return;
  currentFilter = tab.dataset.filter;
  render();
});

document.querySelectorAll('.view-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.view-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentView = btn.dataset.view;
    render();
  });
});

loadData();
</script>
</body>
</html>
